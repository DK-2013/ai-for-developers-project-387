name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Anyone can comment on a public repository. Only maintainers may start a
    # run, and only through their own comments rather than a bot's.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # writes comments and branches, so GITHUB_TOKEN itself stays read-only.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          mentions: /opencode,/oc
          # Public repositories share sessions by default; keep transcripts private.
          share: false
