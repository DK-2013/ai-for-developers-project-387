name: interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Job-level scopes below override this default; the workflow itself needs none.
permissions: {}

concurrency:
  group: oc-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  # Keep every queued command: each admitted attempt is recorded serially, so a
  # later command never overtakes the ledger entry of an earlier one.
  queue: max

jobs:
  # Runs the agent. The budget check is the first step, before checkout, so a
  # single-job rerun re-checks it and a PR branch cannot influence the check.
  opencode:
    # Anyone can comment on a public repository. Only maintainers may start a
    # run, and only through their own comments rather than a bot's.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The preflight step reads the ledger and the PR. It never writes them.
      actions: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # writes comments and branches, so contents on GITHUB_TOKEN stays read-only.
      id-token: write
      # `gh` inside the agent session runs on GITHUB_TOKEN, so issue operations
      # need this scope.
      issues: write
      pull-requests: write
    outputs:
      budget_allowed: ${{ steps.preflight.outputs.allowed }}
      budget_reason: ${{ steps.preflight.outputs.reason }}
      used: ${{ steps.preflight.outputs.used }}
      limit: ${{ steps.preflight.outputs.limit }}
      on_pr: ${{ steps.preflight.outputs.on_pr }}
      pr: ${{ steps.preflight.outputs.pr }}
      model_started: ${{ steps.mark.outputs.started }}
      agent_reason: ${{ steps.model.outputs.reason }}
    steps:
      # The budget script is copied from the default branch before checkout.
      # Running a copy from the PR branch would let that branch change the rule.
      - name: Preflight
        id: preflight
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ github.event.pull_request.number != null || github.event.issue.pull_request != null }}
          LIMIT: ${{ vars.OC_CHAT_LIMIT || '3' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          # A missing key is an infrastructure failure, not a model call: it must
          # be caught before the marker so the attempt is not spent.
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::The OPENCODE_API_KEY secret is not set."
            exit 1
          fi

          script="$RUNNER_TEMP/oc-budget.sh"
          if ! gh api \
            "repos/$REPO/contents/scripts/oc-budget.sh?ref=$DEFAULT_BRANCH" \
            --jq .content |
            base64 -d > "$script"; then
            echo "::error::Cannot read scripts/oc-budget.sh from $DEFAULT_BRANCH."
            exit 1
          fi

          bash "$script" ledger

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The runner has no mise and no hk hooks. Install the toolchain the repo
      # expects and a commit-msg hook, so the agent learns about a malformed
      # commit message before the push instead of from the quality job.
      - name: Prepare toolchain and commit-msg hook
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          mkdir -p .git/hooks
          cat > .git/hooks/commit-msg <<'HOOK'
          #!/bin/sh
          exec ./node_modules/.bin/commitlint --edit "$1"
          HOOK
          chmod +x .git/hooks/commit-msg

      # `opencode github run` implements the action, but the action installs the
      # latest 1.x. Pin the version: the run relies on 1.19.6 pushing the commit
      # the agent made itself instead of committing its own summary.
      - name: Install OpenCode
        timeout-minutes: 3
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # The model boundary. The record job reads this step's conclusion from the
      # Actions API; it must stay the last step before the model call.
      - name: Mark agent start
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        id: model
        # Shorter than the job's timeout, so a stalled model exits with 124 and
        # leaves room to record the attempt and report the outcome.
        timeout-minutes: 28
        env:
          MODEL: ${{ vars.OC_EDIT_MODEL }}
          MENTIONS: /opencode,/oc
          # Public repositories share sessions by default; keep transcripts private.
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          timeout -k 10s 1620s opencode github run
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "reason=timeout" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "reason=agent_failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

  # The only job allowed to write Actions. It records an admitted attempt when
  # the model boundary was reached, or when the attempt was cancelled after
  # admission but before the marker. A preparation failure before the marker
  # spends nothing, and a rerun of only this job does not create a second entry.
  record:
    needs: opencode
    if: always() && needs.opencode.result != 'skipped' && needs.opencode.outputs.on_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Re-read this run's steps (read) and dispatch the ledger entry (write).
      # Write implies read for the Actions scope. These tokens never reach the
      # agent, which finished before this job started.
      actions: write
      # workflow_dispatch is authorised through contents: write.
      contents: write
    steps:
      - name: Record the admitted attempt in the ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ needs.opencode.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::Not a pull request; no ledger entry is recorded."
            exit 0
          fi

          info=$(
            gh api --paginate \
              "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "opencode") | [
                ([.steps[]? | select(.name == "Preflight") | .conclusion][0] // ""),
                ([.steps[]? | select(.name == "Mark agent start") | .conclusion][0] // ""),
                (.conclusion // ""),
                (.started_at // "")
              ] | @tsv' |
              head -n 1
          )
          IFS=$'\t' read -r preflight_result marker opencode_result opencode_started <<< "$info"

          # The jobs endpoint also returns jobs from earlier attempts. If the
          # opencode job started before this attempt, only this job was rerun
          # (for example `record`), so it must not create a second entry.
          attempt_started=$(
            gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT" \
              --jq '.run_started_at'
          )
          if [ -n "$opencode_started" ] && [[ "$opencode_started" < "$attempt_started" ]]; then
            echo "::notice::The opencode job did not run in attempt $RUN_ATTEMPT; no ledger entry."
            exit 0
          fi

          if [ "$preflight_result" != "success" ]; then
            echo "::notice::Preflight did not pass (${preflight_result:-absent}); no ledger entry."
            exit 0
          fi

          if [ "$marker" != "success" ]; then
            case "${opencode_result:-}" in
              cancelled|skipped|"")
                # Admission already happened; a cancellation before the marker
                # is still a spent attempt. An empty result means the job was
                # admitted but never appeared in this attempt.
                echo "::notice::The admitted attempt stopped before the model boundary; recording it."
                ;;
              *)
                echo "::notice::The model boundary was not reached (marker: ${marker:-absent}, opencode: ${opencode_result}); no ledger entry."
                exit 0
                ;;
            esac
          fi

          # The ledger script owns the title format and the count, so the
          # preflight and record jobs cannot drift apart.
          script="$RUNNER_TEMP/oc-budget.sh"
          if ! gh api \
            "repos/$REPO/contents/scripts/oc-budget.sh?ref=$DEFAULT_BRANCH" \
            --jq .content |
            base64 -d > "$script"; then
            echo "::error::Cannot read scripts/oc-budget.sh from $DEFAULT_BRANCH."
            exit 1
          fi
          ledger_has() {
            local result
            if ! result=$(bash "$script" has); then
              echo "::error::Cannot read the ledger."
              exit 1
            fi
            [ "$result" = "true" ]
          }

          if ledger_has; then
            echo "::notice::This attempt already has a ledger entry; nothing to record."
            exit 0
          fi
          # The ledger workflow is the counter. This job dispatches it after
          # the model (or an admitted cancellation). Maintainers reset the PR
          # budget by deleting its ledger runs; the agent never has actions:write.
          gh workflow run oc-budget-ledger.yml \
            --repo "$REPO" --ref "$DEFAULT_BRANCH" \
            -f pr="$PR_NUMBER" -f run="$RUN_ID" -f attempt="$RUN_ATTEMPT"

          # Wait until the entry is visible, so the next queued /oc counts it.
          for _ in $(seq 1 30); do
            if ledger_has; then
              echo "::notice::Ledger entry recorded for PR #$PR_NUMBER."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The ledger entry did not appear; the budget may undercount."
          exit 1

  # Publishes why the model did not finish, without a model or secrets.
  report:
    needs: [opencode, record]
    if: >-
      always() && needs.opencode.result != 'skipped' &&
      (
        needs.opencode.result != 'success' ||
        needs.opencode.outputs.agent_reason != '' ||
        (needs.opencode.outputs.on_pr == 'true' && needs.record.result != 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish why the model did not finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ needs.opencode.outputs.on_pr }}
          BUDGET_ALLOWED: ${{ needs.opencode.outputs.budget_allowed }}
          BUDGET_REASON: ${{ needs.opencode.outputs.budget_reason }}
          USED: ${{ needs.opencode.outputs.used }}
          LIMIT: ${{ needs.opencode.outputs.limit }}
          AGENT_RESULT: ${{ needs.opencode.result }}
          AGENT_REASON: ${{ needs.opencode.outputs.agent_reason }}
          MODEL_STARTED: ${{ needs.opencode.outputs.model_started }}
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUDGET_ALLOWED" != "true" ]; then
            case "${BUDGET_REASON:-infra}" in
              limit_exhausted)
                reason=limit_exhausted
                detail="Бюджет запросов к агенту на этот PR исчерпан (${USED:-?} из ${LIMIT:-?}). Модель не вызывалась."
                ;;
              fork)
                reason=fork
                detail="PR создан из fork: его код не должен видеть ключ модели. Запуск отклонён."
                ;;
              *)
                reason=infra
                detail="Сбой проверки перед вызовом модели (бюджет, права App или конфигурация лимита). Модель не вызывалась."
                ;;
            esac
          elif [ "$AGENT_RESULT" = "success" ]; then
            if [ "${ON_PR:-false}" != "true" ] || [ "$RECORD_RESULT" = "success" ]; then
              exit 0
            fi
            reason=infra
            detail="Не удалось записать попытку в бюджет; счётчик мог не увеличиться."
          elif [ "$AGENT_RESULT" = "cancelled" ]; then
            reason=infra
            detail="Агент был остановлен после допуска; попытка учтена в бюджете."
          else
            case "${AGENT_REASON:-}:${MODEL_STARTED:-}" in
              timeout:*)
                reason=timeout
                detail="Агент не уложился в отведённое время и был остановлен."
                ;;
              :true)
                reason=agent_failed
                detail="Агент завершился ошибкой после старта модели."
                ;;
              :*)
                reason=infra
                detail="Сбой подготовки до вызова модели."
                ;;
              *)
                reason="$AGENT_REASON"
                detail="Агент завершился ошибкой или был остановлен."
                ;;
            esac
          fi

          sha=$GITHUB_SHA
          if [ "${ON_PR:-false}" = "true" ]; then
            sha=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid) || sha=$GITHUB_SHA
          fi

          body="$RUNNER_TEMP/oc-report.md"
          cat > "$body" <<EOF
          **Нужен человек.** Причина: \`$reason\`.

          $detail

          - Последний SHA: \`$sha\`
          - Логи: $RUN_URL
          EOF
          gh issue comment "$NUMBER" --repo "$REPO" --body-file "$body"
