name: interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: oc-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Anyone can comment on a public repository. Only maintainers may start a
    # run, and only through their own comments rather than a bot's.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # writes comments and branches, so contents on GITHUB_TOKEN stays read-only.
      id-token: write
      # `gh` inside the agent session runs on GITHUB_TOKEN, so issue operations
      # need this scope.
      issues: write
      # The chat budget keeps its counter in a comment on the pull request, and
      # GitHub authorizes writes on a pull request through this scope.
      pull-requests: write
    steps:
      # Reads the current budget counter without modifying it. Outputs:
      # - allowed: true/false (whether the request may proceed)
      # - budgeted: true/false (whether this thread uses the budget at all)
      # - used: current count (for display)
      # The counter is NOT incremented here; that happens after checkout and
      # install succeed, ensuring only attempts that reach the model spend budget.
      # Only pull requests are budgeted, and `budgeted` is what tells the
      # increment step to stay away from issues.
      - name: Check chat budget
        id: budget-check
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ github.event.pull_request.number != null || github.event.issue.pull_request != null }}
          LIMIT: ${{ vars.OC_CHAT_LIMIT || '3' }}
        run: |
          set -euo pipefail
          case "$LIMIT" in
            ''|*[!0-9]*)
              echo "::error::vars.OC_CHAT_LIMIT must be a non-negative integer, got '$LIMIT'"
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
          esac
          if [ "$ON_PR" != "true" ]; then
            {
              echo "allowed=true"
              echo "budgeted=false"
              echo "used=0"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Chat budget applies to pull requests; this issue is not budgeted"
            exit 0
          fi

          state=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[]
                    | select(.user.login == "github-actions[bot]")
                    | select(.body | startswith("<!-- oc-chat-budget:"))
                    | [(.id | tostring),
                       (.body | capture("<!-- oc-chat-budget: (?<used>[0-9]+) -->").used)]
                    | @tsv' |
              tail -n 1
          )
          used=0
          if [ -n "$state" ]; then
            used=${state##*$'\t'}
          fi

          if [ "$used" -ge "$LIMIT" ]; then
            {
              echo "allowed=false"
              echo "budgeted=true"
              echo "used=$used"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Chat budget exhausted: $used of $LIMIT requests in PR #$PR_NUMBER"
            body="Бюджет запросов к агенту в этом PR исчерпан (**$used из $LIMIT**). Модель не вызывалась."
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
            exit 0
          fi

          {
            echo "allowed=true"
            echo "budgeted=true"
            echo "used=$used"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Chat budget: $used of $LIMIT requests in PR #$PR_NUMBER"

      - name: Check out repository
        if: steps.budget-check.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # `opencode github run` implements the action, but the action installs the
      # latest 1.x. Pin the version: the run relies on 1.19.6 pushing the commit
      # the agent made itself instead of committing its own summary.
      - name: Install OpenCode
        if: steps.budget-check.outputs.allowed == 'true'
        timeout-minutes: 3
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # Increments the budget counter after checkout and install succeed.
      # This ensures only attempts that actually reach the model spend budget.
      # Issues are not budgeted, so they must never get a counter comment.
      - name: Increment chat budget
        id: budget-increment
        if: >-
          steps.budget-check.outputs.allowed == 'true' &&
          steps.budget-check.outputs.budgeted == 'true'
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PREVIOUS_USED: ${{ steps.budget-check.outputs.used }}
          LIMIT: ${{ vars.OC_CHAT_LIMIT || '3' }}
        run: |
          set -euo pipefail
          used=$((PREVIOUS_USED + 1))
          comment_id=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq '.[]
                    | select(.user.login == "github-actions[bot]")
                    | select(.body | startswith("<!-- oc-chat-budget:"))
                    | .id | tostring' |
              tail -n 1
          )
          body=$(printf '%s\n%s' \
            "<!-- oc-chat-budget: $used -->" \
            "Бюджет запросов к агенту: **$used из $LIMIT**.")
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi
          echo "used=$used" >> "$GITHUB_OUTPUT"
          echo "::notice::Chat budget: $used of $LIMIT requests in PR #$PR_NUMBER"

      - name: Run OpenCode
        if: steps.budget-check.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.OC_EDIT_MODEL }}
          MENTIONS: /opencode,/oc
          # Public repositories share sessions by default; keep transcripts private.
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: opencode github run
