name: interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Job-level scopes below override this default; the workflow itself needs none.
permissions: {}

concurrency:
  group: oc-interactive-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  # Keep every queued command: each admitted attempt is recorded serially, so a
  # later command never overtakes the ledger entry of an earlier one.
  queue: max

jobs:
  # Reads the budget and decides whether the model may run. Holds no secrets and
  # cannot write anything, so the counter it reads is immutable to this job.
  gate:
    # Anyone can comment on a public repository. Only maintainers may start a
    # run, and only through their own comments rather than a bot's.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The ledger workflow's run history is the budget. Reading it needs
      # actions: read only; this job never writes it.
      actions: read
      # Read the PR to confirm it is not from a fork before any secret is used.
      pull-requests: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      reason: ${{ steps.budget.outputs.reason }}
      used: ${{ steps.budget.outputs.used }}
      limit: ${{ steps.budget.outputs.limit }}
      pr: ${{ steps.budget.outputs.pr }}
      on_pr: ${{ steps.budget.outputs.on_pr }}
    steps:
      - name: Check the chat budget
        id: budget
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ github.event.pull_request.number != null || github.event.issue.pull_request != null }}
          LIMIT: ${{ vars.OC_CHAT_LIMIT || '3' }}
        run: |
          set -euo pipefail

          # Emit a blocked decision in one place. The first argument is the
          # reason; the second is the limit to display (defaults to 0).
          fail_budget() {
            {
              echo "allowed=false"
              echo "reason=${1:-infra}"
              echo "used=0"
              echo "limit=${2:-0}"
            } >> "$GITHUB_OUTPUT"
          }

          # The model runs on an OpenCode GitHub App token exchanged via OIDC. If
          # that App could write Actions, the agent could delete ledger runs and
          # reset its own budget, so refuse to run at all.
          if ! app_json=$(gh api apps/opencode-agent 2>/dev/null); then
            echo "::error::Cannot read the opencode-agent App; refusing to run."
            fail_budget infra 0
            exit 1
          fi
          actions_perm=$(printf '%s' "$app_json" | jq -r '.permissions.actions // "none"')
          if [ "$actions_perm" = "write" ]; then
            echo "::error::The opencode-agent App has actions: write; it could reset the budget."
            fail_budget infra "$LIMIT"
            exit 1
          fi

          case "$LIMIT" in
            ''|*[!0-9]*)
              echo "::error::vars.OC_CHAT_LIMIT must be a non-negative integer, got '$LIMIT'"
              fail_budget infra 0
              exit 1
              ;;
          esac

          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          if [ "$ON_PR" != "true" ]; then
            {
              echo "allowed=true"
              echo "on_pr=false"
              echo "used=0"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Chat budget applies to pull requests; issue #$PR_NUMBER is not budgeted"
            exit 0
          fi
          echo "on_pr=true" >> "$GITHUB_OUTPUT"

          # A pull request from a fork must never see the model key. Refuse it
          # before the budget is even consulted; the agent never runs on it.
          head_repo=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            {
              echo "allowed=false"
              echo "reason=fork"
              echo "used=0"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER is from fork '$head_repo'; refusing to run."
            exit 0
          fi

          # A PR's used budget is the number of ledger runs created for it. Each
          # admitted attempt creates exactly one; deleting them resets the count.
          used=$(
            gh api --paginate \
              "repos/$REPO/actions/workflows/oc-budget-ledger.yml/runs?per_page=100" \
              --jq ".workflow_runs[] | select(.display_title | startswith(\"oc-chat-budget PR #$PR_NUMBER \")) | .id" |
              wc -l
          )
          used=$((used + 0))

          if [ "$used" -ge "$LIMIT" ]; then
            {
              echo "allowed=false"
              echo "reason=limit_exhausted"
              echo "used=$used"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Chat budget exhausted: $used of $LIMIT for PR #$PR_NUMBER"
          else
            {
              echo "allowed=true"
              echo "reason="
              echo "used=$used"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Chat budget: $used of $LIMIT used for PR #$PR_NUMBER"
          fi

  # Runs the agent. Keeps the scopes the agent's own `gh` needs, and contains no
  # budget-write logic: it only marks that the model boundary was reached.
  opencode:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # writes comments and branches, so contents on GITHUB_TOKEN stays read-only.
      id-token: write
      # `gh` inside the agent session runs on GITHUB_TOKEN, so issue operations
      # need this scope.
      issues: write
      pull-requests: write
    outputs:
      reason: ${{ steps.outcome.outputs.reason }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The runner has no mise and no hk hooks. Install the toolchain the repo
      # expects and a commit-msg hook, so the agent learns about a malformed
      # commit message before the push instead of from the quality job.
      - name: Prepare toolchain and commit-msg hook
        timeout-minutes: 5
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          mkdir -p .git/hooks
          cat > .git/hooks/commit-msg <<'HOOK'
          #!/bin/sh
          exec ./node_modules/.bin/commitlint --edit "$1"
          HOOK
          chmod +x .git/hooks/commit-msg

      # `opencode github run` implements the action, but the action installs the
      # latest 1.x. Pin the version: the run relies on 1.19.6 pushing the commit
      # the agent made itself instead of committing its own summary.
      - name: Install OpenCode
        timeout-minutes: 3
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # A missing key is an infrastructure failure, not a model call: it must be
      # caught before the marker so the attempt is not spent.
      - name: Check model key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "::error::The OPENCODE_API_KEY secret is not set."
            exit 1
          fi

      # The model boundary. The record job reads this step's conclusion from the
      # Actions API; it must stay the last step before the model call.
      - name: Mark agent start
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        id: model
        # Shorter than the job's timeout, so a stalled model exits with 124 and
        # leaves room to record the attempt and report the outcome.
        timeout-minutes: 28
        env:
          MODEL: ${{ vars.OC_EDIT_MODEL }}
          MENTIONS: /opencode,/oc
          # Public repositories share sessions by default; keep transcripts private.
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          timeout -k 10s 1620s opencode github run
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "reason=timeout" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "reason=agent_failed" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      # Runs even when an earlier step failed, so the report job learns whether
      # the failure was before the model (infra) or after it started.
      - name: Classify outcome
        id: outcome
        if: always()
        env:
          MODEL_OUTCOME: ${{ steps.model.outcome }}
          MODEL_REASON: ${{ steps.model.outputs.reason }}
        run: |
          set -euo pipefail
          reason=""
          case "$MODEL_OUTCOME" in
            success) ;;
            failure) reason="${MODEL_REASON:-agent_failed}" ;;
            *) reason=infra ;;
          esac
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "::notice::Agent outcome: $reason"
          fi

  # The only job allowed to write Actions. It records the attempt only after the
  # model boundary was reached, so preparation failures spend nothing while a
  # cancellation, timeout or failure after the marker still spends the attempt.
  record:
    needs: [gate, opencode]
    if: always() && needs.opencode.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Re-read this run's steps (read) and dispatch the ledger entry (write).
      # Write implies read for the Actions scope. These tokens never reach the
      # agent, which finished before this job started.
      actions: write
      # workflow_dispatch is authorised through contents: write.
      contents: write
    steps:
      - name: Record the admitted attempt in the ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ON_PR: ${{ needs.gate.outputs.on_pr }}
          PR_NUMBER: ${{ needs.gate.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${ON_PR:-false}" != "true" ] || [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::Not a pull request; no ledger entry is recorded."
            exit 0
          fi

          # Did this attempt reach the model boundary? Read the marker step from
          # the Actions API for this exact attempt. A job that timed out or was
          # cancelled mid-model still has the marker recorded as success; a
          # failure before it leaves the step skipped or absent.
          marker=$(
            gh api --paginate \
              "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "opencode") | .steps[]? | select(.name == "Mark agent start") | .conclusion' |
              head -n 1
          )
          if [ "$marker" != "success" ]; then
            echo "::notice::The model boundary was not reached (marker: ${marker:-absent}); no ledger entry."
            exit 0
          fi

          expected="oc-chat-budget PR #$PR_NUMBER run $RUN_ID attempt $RUN_ATTEMPT"
          count_entries() {
            gh api --paginate \
              "repos/$REPO/actions/workflows/oc-budget-ledger.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.display_title == \"$expected\")] | length" |
              awk '{s+=$1} END{print s+0}'
          }

          before=$(count_entries)
          if [ "$before" -gt 0 ]; then
            echo "::notice::This attempt already has a ledger entry; nothing to record."
            exit 0
          fi
          gh workflow run oc-budget-ledger.yml \
            --repo "$REPO" --ref "$DEFAULT_BRANCH" \
            -f pr="$PR_NUMBER" -f run="$RUN_ID" -f attempt="$RUN_ATTEMPT"

          # Wait until the entry is visible, so the next queued /oc counts it.
          for _ in $(seq 1 30); do
            if [ "$(count_entries)" -gt "$before" ]; then
              echo "::notice::Ledger entry recorded for PR #$PR_NUMBER."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The ledger entry did not appear; the budget may undercount."
          exit 1

  # Publishes why the model did not finish, without a model or secrets.
  report:
    needs: [gate, opencode, record]
    if: >-
      always() && (
        needs.gate.result == 'failure' ||
        (needs.gate.result == 'success' && (
          needs.gate.outputs.allowed != 'true' ||
          needs.opencode.result == 'failure' ||
          needs.opencode.result == 'cancelled' ||
          needs.record.result == 'failure'
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish why the model did not finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ON_PR: ${{ needs.gate.outputs.on_pr }}
          GATE_RESULT: ${{ needs.gate.result }}
          GATE_ALLOWED: ${{ needs.gate.outputs.allowed }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          USED: ${{ needs.gate.outputs.used }}
          LIMIT: ${{ needs.gate.outputs.limit }}
          AGENT_RESULT: ${{ needs.opencode.result }}
          AGENT_REASON: ${{ needs.opencode.outputs.reason }}
          RECORD_RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$GATE_RESULT" = "failure" ]; then
            reason=infra
            detail="Сбой проверки бюджета перед вызовом модели (конфигурация лимита или права App). Модель не вызывалась."
          elif [ "$GATE_ALLOWED" != "true" ]; then
            case "${GATE_REASON:-limit_exhausted}" in
              limit_exhausted)
                reason=limit_exhausted
                detail="Бюджет запросов к агенту на этот PR исчерпан (${USED:-?} из ${LIMIT:-?}). Модель не вызывалась."
                ;;
              fork)
                reason=fork
                detail="PR создан из fork: его код не должен видеть ключ модели. Запуск отклонён."
                ;;
              *)
                reason=infra
                detail="Запуск отклонён проверкой перед вызовом модели."
                ;;
            esac
          elif [ "$AGENT_RESULT" = "skipped" ]; then
            reason=infra
            detail="Агент не запустился после успешной проверки бюджета."
          elif [ "$AGENT_RESULT" != "success" ]; then
            reason=${AGENT_REASON:-agent_failed}
            if [ "$reason" = "timeout" ]; then
              detail="Агент не уложился в отведённое время и был остановлен."
            else
              detail="Агент завершился ошибкой или был остановлен."
            fi
          elif [ "$RECORD_RESULT" != "success" ]; then
            reason=infra
            detail="Не удалось записать попытку в бюджет; счётчик мог не увеличиться."
          else
            exit 0
          fi

          sha=$GITHUB_SHA
          if [ "${ON_PR:-false}" = "true" ]; then
            sha=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid) || sha=$GITHUB_SHA
          fi

          body="$RUNNER_TEMP/oc-report.md"
          cat > "$body" <<EOF
          **Нужен человек.** Причина: \`$reason\`.

          $detail

          - Последний SHA: \`$sha\`
          - Логи: $RUN_URL
          EOF
          gh issue comment "$NUMBER" --repo "$REPO" --body-file "$body"
