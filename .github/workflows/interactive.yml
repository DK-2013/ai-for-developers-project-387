name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Anyone can comment on a public repository. Only maintainers may start a
    # run, and only through their own comments rather than a bot's.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association
      ) &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, ' /oc') ||
       contains(github.event.comment.body, ' /opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # writes comments and branches, so GITHUB_TOKEN itself stays read-only.
      id-token: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # `opencode github run` implements the action, but the action installs the
      # latest 1.x. Pin the version: the run relies on 1.19.6 pushing the commit
      # the agent made itself instead of committing its own summary.
      - name: Install OpenCode
        timeout-minutes: 3
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode
        env:
          MODEL: ${{ vars.OC_EDIT_MODEL }}
          MENTIONS: /opencode,/oc
          # Public repositories share sessions by default; keep transcripts private.
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: opencode github run
