name: triage

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: oc-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Exchanged through OIDC for an OpenCode GitHub App token. That token
      # may comment on the issue, so GITHUB_TOKEN itself stays read-only.
      id-token: write
    steps:
      - name: Decide whether to triage
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue
            const author = issue.user || {}
            if (author.type === "Bot" || !author.login) {
              core.setOutput("should-run", "false")
              return
            }

            const skip = new Set([
              "needs-triage",
              "needs-info",
              "ready-for-agent",
              "ready-for-human",
              "wontfix",
            ])
            const labels = (issue.labels || [])
              .map((label) => (typeof label === "string" ? label : label.name || ""))
            if (labels.some((name) => skip.has(name) || name.startsWith("wayfinder:"))) {
              core.setOutput("should-run", "false")
              return
            }

            const user = await github.rest.users.getByUsername({
              username: author.login,
            })
            const created = new Date(user.data.created_at)
            const days = (Date.now() - created.getTime()) / (1000 * 60 * 60 * 24)
            core.setOutput("should-run", days >= 30 ? "true" : "false")
          result-encoding: string

      - name: Check out repository
        if: steps.gate.outputs.should-run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The composite action pins a ref but installs the latest OpenCode
      # release. Pin the version so the triage run keeps its read-only behavior.
      - name: Install OpenCode
        if: steps.gate.outputs.should-run == 'true'
        timeout-minutes: 3
        env:
          OPENCODE_VERSION: 1.19.6
          OPENCODE_SHA256: 47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/opencode.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          echo "${OPENCODE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$HOME/.opencode/bin"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run OpenCode triage
        if: steps.gate.outputs.should-run == 'true'
        timeout-minutes: 10
        env:
          MODEL: opencode/big-pickle
          SHARE: "false"
          USE_GITHUB_TOKEN: "false"
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Triage only explains the issue. Deny edits and shell so the working
          # tree cannot become dirty; otherwise OpenCode commits its own
          # sub-40-character summary, which fails commitlint.
          OPENCODE_PERMISSION: '{"edit":"deny","bash":{"*":"deny"}}'
          PROMPT: |
            You are triaging a newly opened GitHub issue in this repository.
            Read the issue and relevant repository context before answering.
            Use docs/agents/issue-tracker.md and docs/agents/triage-labels.md for
            tracker conventions and triage labels. If helpful, use
            .agents/skills/triage/SKILL.md as guidance, but do not perform the
            full interactive triage workflow.

            Your task is only to explain the issue:
            - Summarize what is being reported or requested.
            - If there is a clear fix, relevant documentation, or specific code
              locations to check, include them with concrete references.
            - If the issue is unclear or you cannot provide a useful explanation,
              do not comment.

            Do not edit files, create branches, open pull requests, add or remove
            labels, or close the issue.
        run: opencode github run
