# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json
ignores:
  - rule: dangerous-triggers
    file: .github/workflows/interactive.yml
    reason: >-
      issue_comment and pull_request_review_comment are the only supported entry
      points for OpenCode; the job runs only for OWNER, MEMBER or COLLABORATOR
      comments, keeps GITHUB_TOKEN at contents:read, and lets the agent write
      only through the OpenCode GitHub App token obtained via OIDC.
    expires: "2027-05-13"
  - rule: dangerous-triggers
    file: .github/workflows/triage.yml
    reason: >-
      issues.opened is required to triage new issues automatically; the job
      triages only non-bot accounts at least 30 days old, skips issues that are
      already labeled as triaged or prepared by skills, keeps GITHUB_TOKEN at
      contents:read, and allows writes only through the OpenCode GitHub App
      token obtained via OIDC.
    expires: "2027-05-13"
